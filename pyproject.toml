[project]
name = "compendium-mcp"
version = "0.1.0"
description = "One MCP server for all your personal knowledge: notes, documents, and data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
docx = ["python-docx>=1.1"]
all = ["pypdf>=5.0", "python-docx>=1.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pypdf>=5.0", "python-docx>=1.1"]

[project.scripts]
compendium = "compendium_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
